<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google-adsense-account" content="ca-pub-8375707403164817">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8375707403164817"
     crossorigin="anonymous"></script>
<title>로또 번호 생성기</title>
<style>
  :root {
    --bg: #0f1220;
    --card: #1a1e33;
    --text: #f5f6fa;
    --muted: #9a9fbf;
    --accent: #6c7cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: radial-gradient(circle at top, #1c2140, #0b0d18 70%);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color: var(--text);
    padding: 24px;
  }
  .page {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    margin: auto 0;
  }
  .app {
    width: 100%;
    background: var(--card);
    border-radius: 20px;
    padding: 32px 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
  }
  .comments-card {
    width: 100%;
    background: var(--card);
    border-radius: 20px;
    padding: 24px 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
  }
  h1 {
    margin: 0 0 4px;
    font-size: 24px;
    text-align: center;
  }
  p.sub {
    margin: 0 0 24px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
  }
  .controls {
    display: flex;
    gap: 10px;
    align-items: center;
    justify-content: center;
    margin-bottom: 24px;
  }
  .controls label {
    font-size: 14px;
    color: var(--muted);
  }
  select, button {
    font-family: inherit;
    font-size: 15px;
    border-radius: 10px;
    border: none;
    padding: 10px 14px;
  }
  select {
    background: #262b4a;
    color: var(--text);
  }
  button {
    background: var(--accent);
    color: white;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(108,124,255,0.4); }
  button:active { transform: translateY(0); }
  button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }

  .games {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .game-row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #14172a;
    border-radius: 14px;
    padding: 12px 14px;
    opacity: 0;
    transform: translateY(6px);
    animation: rise 0.4s ease forwards;
  }
  .game-row .game-label {
    font-size: 12px;
    color: var(--muted);
    width: 44px;
    flex-shrink: 0;
  }
  .balls {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .ball {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 14px;
    color: #14172a;
    box-shadow: inset 0 -3px 4px rgba(0,0,0,0.2), 0 2px 6px rgba(0,0,0,0.3);
    opacity: 0;
    transform: scale(0.4);
    animation: pop 0.35s ease forwards;
  }
  .ball.b1 { background: #fbc400; }
  .ball.b2 { background: #69c8f2; }
  .ball.b3 { background: #ff7272; }
  .ball.b4 { background: #aaaaaa; }
  .ball.b5 { background: #b0d840; }

  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes pop {
    to { opacity: 1; transform: scale(1); }
  }

  .empty {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 20px 0;
  }

  @media (prefers-color-scheme: light) {
    body { background: radial-gradient(circle at top, #eef0ff, #f7f8fc 70%); }
    :root {
      --bg: #f7f8fc;
      --card: #ffffff;
      --text: #1a1e33;
      --muted: #6b7099;
    }
    select { background: #eef0f8; }
    .game-row { background: #f4f5fb; }
    .ball { color: #1a1e33; }
  }
</style>
</head>
<body>
  <div class="page">
  <div class="app">
    <h1>🎱 로또 번호 생성기</h1>
    <p class="sub">1~45 중 서로 다른 6개 번호를 무작위로 뽑아드려요</p>

    <div class="controls">
      <label for="count">게임 수</label>
      <select id="count">
        <option value="1">1게임</option>
        <option value="2">2게임</option>
        <option value="3">3게임</option>
        <option value="4">4게임</option>
        <option value="5">5게임</option>
      </select>
      <button id="generate">번호 생성</button>
    </div>

    <div id="games" class="games">
      <div class="empty">버튼을 눌러 번호를 생성해보세요</div>
    </div>

    <a href="contact.html" style="display:block; margin-top:20px; text-align:center; font-size:13px; color:var(--muted); text-decoration:none;">🤝 제휴 문의하기</a>
  </div>

  <div class="comments-card">
    <div id="disqus_thread"></div>
    <script>
        var disqus_config = function () {
        this.page.url = window.location.href;
        this.page.identifier = 'lotto-index';
        };
        (function() { // DON'T EDIT BELOW THIS LINE
        var d = document, s = d.createElement('script');
        s.src = 'https://jjaeseongmin.disqus.com/embed.js';
        s.setAttribute('data-timestamp', +new Date());
        (d.head || d.body).appendChild(s);
        })();
    </script>
    <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>
  </div>
  </div>

  <script>
    function ballClass(n) {
      if (n <= 10) return 'b1';
      if (n <= 20) return 'b2';
      if (n <= 30) return 'b3';
      if (n <= 40) return 'b4';
      return 'b5';
    }

    function generateOneGame() {
      const numbers = new Set();
      while (numbers.size < 6) {
        numbers.add(Math.floor(Math.random() * 45) + 1);
      }
      return [...numbers].sort((a, b) => a - b);
    }

    function render(games) {
      const container = document.getElementById('games');
      container.innerHTML = '';
      games.forEach((game, i) => {
        const row = document.createElement('div');
        row.className = 'game-row';
        row.style.animationDelay = `${i * 0.06}s`;

        const label = document.createElement('div');
        label.className = 'game-label';
        label.textContent = `${i + 1}게임`;

        const balls = document.createElement('div');
        balls.className = 'balls';
        game.forEach((n, j) => {
          const ball = document.createElement('div');
          ball.className = `ball ${ballClass(n)}`;
          ball.textContent = n;
          ball.style.animationDelay = `${i * 0.06 + j * 0.05}s`;
          balls.appendChild(ball);
        });

        row.appendChild(label);
        row.appendChild(balls);
        container.appendChild(row);
      });
    }

    document.getElementById('generate').addEventListener('click', () => {
      const count = Number(document.getElementById('count').value);
      const games = Array.from({ length: count }, generateOneGame);
      render(games);
    });
  </script>
</body>
</html>
