<meta name="description" content="로또 번호 생성기 사이트의 제휴 및 협업 문의 양식입니다.">
<meta name="google-adsense-account" content="ca-pub-8375707403164817">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8375707403164817"
     crossorigin="anonymous"></script>
<title>제휴 문의 | 로또 번호 생성기</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <nav>
      <a class="logo" href="index.html">🎱 로또 번호 생성기</a>
      <div class="links">
        <a href="index.html">홈</a>
        <a href="about.html">소개</a>
        <a href="contact.html" class="active">제휴 문의</a>
        <a href="privacy.html">개인정보처리방침</a>
      </div>
    </nav>
  </header>

  <div class="page">
  <div class="card">
    <h1>🤝 제휴 문의</h1>
    <p class="sub">제휴/협업 관련 문의를 남겨주시면 빠르게 답변드릴게요</p>

    <form id="contact-form" action="https://formspree.io/f/xpqvbplk" method="POST">
      <div class="field">
        <label for="name">이름 / 회사명</label>
        <input type="text" id="name" name="name" required>
      </div>

      <div class="field">
        <label for="email">이메일</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="field">
        <label for="message">문의 내용</label>
        <textarea id="message" name="message" required placeholder="제휴 목적과 내용을 자유롭게 작성해주세요"></textarea>
      </div>

      <input type="text" name="_gotcha" style="display:none">
      <input type="hidden" name="_subject" value="새로운 제휴 문의">

      <button type="submit" id="submit-btn">문의 보내기</button>
    </form>

    <p id="status" class="status"></p>
    <a class="back" href="index.html">← 로또 번호 생성기로 돌아가기</a>
  </div>
  </div>

  <footer class="site-footer">
    <div class="links">
      <a href="index.html">홈</a>
      <a href="about.html">소개</a>
      <a href="contact.html">제휴 문의</a>
      <a href="privacy.html">개인정보처리방침</a>
    </div>
    <p class="copyright">© 2026 로또 번호 생성기. 오락 목적의 서비스이며 특정 복권 발행 기관과 관련이 없습니다.</p>
  </footer>

  <script>
    const form = document.getElementById('contact-form');
    const statusEl = document.getElementById('status');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      statusEl.className = 'status';
      statusEl.textContent = '';

      try {
        const response = await fetch(form.action, {
          method: 'POST',
          body: new FormData(form),
          headers: { 'Accept': 'application/json' }
        });

        if (response.ok) {
          statusEl.textContent = '문의가 전송되었습니다. 감사합니다!';
          statusEl.className = 'status success';
          form.reset();
        } else {
          statusEl.textContent = '전송에 실패했습니다. 잠시 후 다시 시도해주세요.';
          statusEl.className = 'status error';
        }
      } catch (err) {
        statusEl.textContent = '전송 중 오류가 발생했습니다. 네트워크를 확인해주세요.';
        statusEl.className = 'status error';
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
